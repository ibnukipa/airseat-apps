apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.redesign.bookstoreai.audiobookplayer'
version = '0.1.0'

// Simple helper that allows the root project to override versions declared by this library.
ext.safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Ensures backward compatibility
ext.getExtOrDefault = { name ->
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties[name]
}

ext.getExtOrIntegerDefault = { name ->
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties[name]).toInteger()
}

android {
  compileSdkVersion safeExtGet("compileSdkVersion", 29)

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_1_8
  }

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 21)
    targetSdkVersion safeExtGet("targetSdkVersion", 29)
    versionCode 1
    versionName "1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  // ref: https://www.baeldung.com/maven-local-repository
  mavenLocal()
  maven {
    // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
    url "$rootDir/../node_modules/react-native/android"
  }
  maven {
    // Android JSC is installed from npm
    url "$rootDir/../node_modules/jsc-android/dist"
  }
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-native:+'
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.4.32"
  
  // ExoPlayer dependencies (compatible with older versions)
  implementation 'com.google.android.exoplayer:exoplayer:2.14.2'
  implementation 'com.google.android.exoplayer:exoplayer-core:2.14.2'
  implementation 'com.google.android.exoplayer:exoplayer-ui:2.14.2'
  implementation 'com.google.android.exoplayer:exoplayer-dash:2.14.2'
  implementation 'com.google.android.exoplayer:exoplayer-hls:2.14.2'
  implementation 'com.google.android.exoplayer:exoplayer-smoothstreaming:2.14.2'
  
  // Media session support
  implementation 'androidx.media:media:1.3.1'
  
  // Image loading
  implementation 'io.coil-kt:coil:1.4.0'
  
  // Expo modules (if available)
  if (findProject(':expo-modules-core')) {
    implementation project(':expo-modules-core')
  }
}